:root {
  /* ─── Base colors ──────────────────────────────────────────────── */
  /* Purple — primary brand */
  --sds-purple-98: #F6F4FF;
  --sds-purple-95: #EBE6FE;
  --sds-purple-90: #D1CDFF;
  --sds-purple-87: #C2BCFF;
  --sds-purple-84: #B4AEFF;
  --sds-purple-76: #9284FF;
  --sds-purple-65: #7351FB;   /* brand action */
  --sds-purple-61: #643FFA;
  --sds-purple-55: #5531E8;
  --sds-purple-46: #4324C8;
  --sds-purple-39: #351AAD;
  --sds-purple-31: #260D92;
  --sds-purple-20: #150266;
  --sds-purple-10: #0A0132;   /* brand dark / default fg */

  /* Neutral */
  --sds-neutral-100: #FFFFFF;
  --sds-neutral-97:  #F7F7F7;
  --sds-neutral-95:  #F1F1F1;
  --sds-neutral-92:  #EBEBEB;
  --sds-neutral-90:  #E5E5E5;
  --sds-neutral-87:  #DEDEDE;
  --sds-neutral-84:  #D6D6D6;
  --sds-neutral-80:  #CCCCCC;
  --sds-neutral-58:  #959595;
  --sds-neutral-46:  #767676;
  --sds-neutral-40:  #656565;
  --sds-neutral-35:  #595959;
  --sds-neutral-31:  #4F4F4F;
  --sds-neutral-25:  #404040;
  --sds-neutral-20:  #333333;
  --sds-neutral-15:  #262626;
  --sds-neutral-10:  #1A1A1A;
  --sds-neutral-0:   #000000;

  /* Semantic — status */
  --sds-green-89:  #CFF7E2;
  --sds-green-30:  #138849;
  --sds-green-23:  #007638;
  --sds-green-22:  #096638;
  --sds-green-18:  #07542E;
  --sds-green-15:  #054625;
  --sds-green-9:   #032B17;

  --sds-yellow-91: #FCEED2;
  --sds-yellow-50: #FFB700;
  --sds-yellow-48: #F6A000;
  --sds-yellow-46: #ED9200;

  --sds-red-96: #FFEAE9;
  --sds-red-68: #E87373;
  --sds-red-52: #D74033;
  --sds-red-40: #CC1201;
  --sds-red-36: #B60203;
  --sds-red-30: #970002;
  --sds-red-25: #7F0001;
  --sds-red-14: #470001;

  --sds-blue-95: #E6F0FF;
  --sds-blue-54: #136DFF;
  --sds-blue-46: #005AEA;
  --sds-blue-41: #004FCF;
  --sds-blue-33: #0041A9;
  --sds-blue-27: #00368C;
  --sds-blue-15: #001D4D;

  /* Data-viz categorical palette */
  --sds-dv-1: #FF957A;
  --sds-dv-2: #FFAC70;
  --sds-dv-3: #FBC774;
  --sds-dv-4: #FBE774;
  --sds-dv-5: #82E3CB;
  --sds-dv-6: #75C7F0;
  --sds-dv-7: #CCA3F5;
  --sds-dv-8: #F5A3CC;

  /* ─── Semantic color roles ─────────────────────────────────────── */
  --sds-color-background-default:    var(--sds-neutral-100);
  --sds-color-background-subtle:     var(--sds-neutral-97);
  --sds-color-background-muted:      var(--sds-neutral-95);
  --sds-color-background-inverse:    var(--sds-purple-10);
  --sds-color-background-accent:     var(--sds-purple-95);

  --sds-color-text-default:          var(--sds-purple-10);
  --sds-color-text-subtle:           var(--sds-neutral-35);
  --sds-color-text-muted:            var(--sds-neutral-46);
  --sds-color-text-inverse:          var(--sds-neutral-100);
  --sds-color-text-action:           var(--sds-purple-65);
  --sds-color-text-action-hover:     var(--sds-purple-55);

  --sds-color-border-default:        var(--sds-neutral-87);
  --sds-color-border-subtle:         var(--sds-neutral-92);
  --sds-color-border-strong:         var(--sds-purple-10);
  --sds-color-border-action:         var(--sds-purple-65);
  --sds-color-border-focus:          var(--sds-purple-65);

  --sds-color-action-default:        var(--sds-purple-65);
  --sds-color-action-hover:          var(--sds-purple-55);
  --sds-color-action-active:         var(--sds-purple-46);

  --sds-color-info-background:       var(--sds-blue-95);
  --sds-color-info-border:           var(--sds-blue-46);
  --sds-color-info-text:             var(--sds-blue-15);

  --sds-color-success-background:    var(--sds-green-89);
  --sds-color-success-border:        var(--sds-green-23);
  --sds-color-success-text:          var(--sds-green-9);

  --sds-color-warning-background:    var(--sds-yellow-91);
  --sds-color-warning-border:        var(--sds-yellow-48);
  --sds-color-warning-text:          var(--sds-neutral-10);

  --sds-color-danger-background:     var(--sds-red-96);
  --sds-color-danger-border:         var(--sds-red-40);
  --sds-color-danger-text:           var(--sds-red-14);

  --sds-color-shadow-elevated-default: rgba(10, 1, 50, 0.10);
  --sds-color-shadow-elevated-hover:   rgba(10, 1, 50, 0.16);

  /* ─── Size / space scale ─────────────────────────────────────── */
  --sds-size-xxxs: 2px;
  --sds-size-xxs:  4px;
  --sds-size-xs:   8px;
  --sds-size-s:    12px;
  --sds-size-s1:   16px;
  --sds-size-m:    24px;
  --sds-size-m1:   32px;
  --sds-size-l:    48px;
  --sds-size-xl:   96px;
  --sds-size-xxl:  192px;

  --sds-padding-infinitesimal: var(--sds-size-xxxs);
  --sds-padding-minimal:       var(--sds-size-xxs);
  --sds-padding-tiny:          var(--sds-size-xs);
  --sds-padding-small:         var(--sds-size-s);
  --sds-padding-medium:        var(--sds-size-s);
  --sds-padding-large:         var(--sds-size-m);
  --sds-padding-huge:          var(--sds-size-m1);

  --sds-radius-minimal: var(--sds-size-xxs);  /* 4 */
  --sds-radius-small:   var(--sds-size-xs);   /* 8 */
  --sds-radius-medium:  var(--sds-size-s);    /* 12 */
  --sds-radius-large:   var(--sds-size-m);    /* 24 */
  --sds-radius-full:    99999px;

  --sds-border-thin:    1px;
  --sds-border-regular: 2px;
  --sds-border-bold:    4px;

  --sds-shadow-elevated-default: 0 4px 24px var(--sds-color-shadow-elevated-default);
  --sds-shadow-elevated-hover:   0 4px 12px var(--sds-color-shadow-elevated-hover);

  /* Breakpoints */
  --sds-bp-mobile:    0px;
  --sds-bp-tablet:    720px;
  --sds-bp-desktop:   1024px;
  --sds-bp-ultrawide: 1440px;

  /* Z-index */
  --sds-z-default: auto;
  --sds-z-menu:    1000;
  --sds-z-drawer:  2000;
  --sds-z-modal:   3000;

  /* ─── Typography base ─────────────────────────────────────────── */
  --sds-font-family: "Haffer", Arial, system-ui, sans-serif;
  --sds-font-mono:   "Menlo", "Consolas", monospace;

  --sds-fw-regular:  400;
  --sds-fw-semibold: 600;
  --sds-fw-bold:     700;

  --sds-fs-100:  12px;
  --sds-fs-200:  14px;
  --sds-fs-300:  16px;
  --sds-fs-400:  18px;
  --sds-fs-500:  20px;
  --sds-fs-600:  22px;
  --sds-fs-700:  24px;
  --sds-fs-800:  28px;
  --sds-fs-900:  32px;
  --sds-fs-1000: 36px;
  --sds-fs-1100: 42px;
  --sds-fs-1200: 48px;
  --sds-fs-1300: 56px;
  --sds-fs-1400: 64px;
  --sds-fs-1500: 72px;

  --sds-lh-xs: 1.15;
  --sds-lh-s:  1.25;
  --sds-lh-m:  1.35;
  --sds-lh-l:  1.5;
  --sds-lh-xl: 1.6;
}

/* ─── Global defaults ─────────────────────────────────────────── */
html, body {
  font-family: var(--sds-font-family);
  font-weight: var(--sds-fw-regular);
  color: var(--sds-color-text-default);
  background: var(--sds-color-background-default);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ─── Editorial headline (long-form / marketing) ─────────────── */
.sds-headline-xxl { font-family: var(--sds-font-family); font-weight: 600; font-size: 48px; line-height: 1.15; letter-spacing: -0.01em; }
.sds-headline-xl  { font-family: var(--sds-font-family); font-weight: 600; font-size: 42px; line-height: 1.15; letter-spacing: -0.01em; }
.sds-headline-l   { font-family: var(--sds-font-family); font-weight: 600; font-size: 32px; line-height: 1.15; }
.sds-headline-m   { font-family: var(--sds-font-family); font-weight: 600; font-size: 28px; line-height: 1.25; }
.sds-headline-s   { font-family: var(--sds-font-family); font-weight: 600; font-size: 24px; line-height: 1.25; }
.sds-headline-xs  { font-family: var(--sds-font-family); font-weight: 600; font-size: 22px; line-height: 1.35; }
.sds-headline-xxs { font-family: var(--sds-font-family); font-weight: 600; font-size: 16px; line-height: 1.5; }

/* ─── Application headline (product UI) ─────────────────────── */
.sds-app-h-xxl { font-family: var(--sds-font-family); font-weight: 600; font-size: 36px; line-height: 1.25; }
.sds-app-h-xl  { font-family: var(--sds-font-family); font-weight: 600; font-size: 28px; line-height: 1.25; }
.sds-app-h-l   { font-family: var(--sds-font-family); font-weight: 600; font-size: 24px; line-height: 1.25; }
.sds-app-h-m   { font-family: var(--sds-font-family); font-weight: 600; font-size: 22px; line-height: 1.25; }
.sds-app-h-s   { font-family: var(--sds-font-family); font-weight: 600; font-size: 20px; line-height: 1.35; }
.sds-app-h-xs  { font-family: var(--sds-font-family); font-weight: 600; font-size: 18px; line-height: 1.35; }
.sds-app-h-xxs { font-family: var(--sds-font-family); font-weight: 600; font-size: 16px; line-height: 1.35; }

/* ─── Body copy ─────────────────────────────────────────────── */
.sds-body-xl      { font-weight: 400; font-size: 20px; line-height: 1.5; }
.sds-body-l       { font-weight: 400; font-size: 18px; line-height: 1.35; }
.sds-body-default { font-weight: 400; font-size: 16px; line-height: 1.5; }
.sds-body-s       { font-weight: 400; font-size: 14px; line-height: 1.6; }

/* ─── Label ─────────────────────────────────────────────────── */
.sds-label    { font-weight: 600; font-size: 16px; line-height: 1.5; }
.sds-label-l  { font-weight: 600; font-size: 18px; line-height: 1.35; }

/* ─── Overline (sparing uppercase) ─────────────────────────── */
.sds-overline { font-weight: 600; font-size: 12px; line-height: 1.35; letter-spacing: 0.06em; text-transform: uppercase; }

/* ─── Code ──────────────────────────────────────────────────── */
.sds-code { font-family: var(--sds-font-mono); font-size: 14px; background: var(--sds-neutral-95); padding: 2px 6px; border-radius: 4px; }

/* ─── Heading element defaults (site-level) ────────────────── */
h1 { font-family: var(--sds-font-family); font-weight: 600; font-size: 48px; line-height: 1.15; margin: 0 0 .4em; color: var(--sds-color-text-default); }
h2 { font-family: var(--sds-font-family); font-weight: 600; font-size: 32px; line-height: 1.15; margin: 1.6em 0 .4em; }
h3 { font-family: var(--sds-font-family); font-weight: 600; font-size: 24px; line-height: 1.25; margin: 1.4em 0 .4em; }
h4 { font-family: var(--sds-font-family); font-weight: 600; font-size: 20px; line-height: 1.35; margin: 1.2em 0 .4em; }
h5 { font-family: var(--sds-font-family); font-weight: 600; font-size: 18px; line-height: 1.35; margin: 1em 0 .4em; }
h6 { font-family: var(--sds-font-family); font-weight: 600; font-size: 16px; line-height: 1.5; margin: 1em 0 .4em; }
p  { font-weight: 400; font-size: 16px; line-height: 1.5; margin: 0 0 1em; }
p  { text-wrap: pretty; }
a  { color: var(--sds-color-text-action); text-decoration: underline; text-underline-offset: 2px; }
a:hover { color: var(--sds-color-text-action-hover); }

::selection { background: var(--sds-purple-90); color: var(--sds-purple-10); }



/* ============================================================
   Læremiddelkatalogen — base styles
   A faithful recreation of the Startside, built on the Sikt
   Design System. Treat this file as the source of truth:
   copy Startside.html alongside it to spin up experiments.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--sds-neutral-95);
  color: var(--sds-color-text-default);
  font-family: var(--sds-font-family);
}

#root { min-height: 100vh; display: flex; flex-direction: column; }

/* shared content container */
.lk-container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 24px; }

/* ---------- Buttons ---------- */
.lk-btn {
  font-family: var(--sds-font-family);
  font-weight: var(--sds-fw-semibold);
  font-size: var(--sds-fs-300);
  line-height: 1;
  border-radius: var(--sds-radius-full);
  padding: 14px 24px;
  border: 2px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
  white-space: nowrap;
}
.lk-btn svg { flex: none; }
.lk-btn--strong { background: var(--sds-color-action-default); color: #fff; border-color: var(--sds-color-action-default); }
.lk-btn--strong:hover { background: var(--sds-color-action-hover); border-color: var(--sds-color-action-hover); color:#fff; }
.lk-btn--strong:active { background: var(--sds-color-action-active); border-color: var(--sds-color-action-active); }
.lk-btn--subtle { background: #fff; color: var(--sds-purple-10); border-color: var(--sds-purple-10); }
.lk-btn--subtle:hover { background: var(--sds-neutral-97); color: var(--sds-purple-10); }
/* lavender button used inside the accent "under utvikling" box */
.lk-btn--accent { background: var(--sds-purple-87); color: var(--sds-purple-10); border-color: var(--sds-purple-87); }
.lk-btn--accent:hover { background: var(--sds-purple-84); border-color: var(--sds-purple-84); color: var(--sds-purple-10); }

/* ---------- Header ---------- */
.lk-header {
  position: sticky; top: 0; z-index: var(--sds-z-menu);
  background: var(--sds-purple-95);
  border-bottom: 1px solid var(--sds-purple-90);
}
.lk-header--plain { background: var(--sds-neutral-100); border-bottom-color: var(--sds-neutral-90); }
.lk-header__inner {
  max-width: 1400px; margin: 0 auto;
  padding: 18px 40px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.lk-logo { display: inline-flex; align-items: center; gap: 14px; color: var(--sds-purple-10); text-decoration: none; }
.lk-logo svg { height: 30px; width: auto; display: block; }
.lk-logo__word { font-size: var(--sds-fs-600); font-weight: var(--sds-fw-semibold); letter-spacing: -.01em; line-height: 1; }

.lk-header__right { display: flex; align-items: center; gap: 12px; }

/* Feide login button */
.lk-feide {
  display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
  font-family: var(--sds-font-family); color: var(--sds-purple-10);
  border: none; border-radius: var(--sds-radius-full);
}
.lk-feide svg { flex: none; }
.lk-feide--ghost { background: transparent; padding: 8px 12px; font-size: var(--sds-fs-300); }
.lk-feide--ghost:hover { background: var(--sds-purple-90); }
.lk-feide--solid { background: #B8D6F5; padding: 8px 16px; font-size: var(--sds-fs-400); font-weight: var(--sds-fw-semibold); }
.lk-feide--solid:hover { background: #A3C9F0; }
.lk-feide:focus-visible { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }
.lk-feide[disabled] { cursor: default; }
.lk-spin { animation: lk-spin 1.1s linear infinite; }
@keyframes lk-spin { to { transform: rotate(360deg); } }

/* "Nytt" tag (logg inn-kort) */
.lk-tag-new {
  display: inline-flex; align-items: center; gap: 6px;
  background: #82E3CB; color: var(--sds-purple-10);
  border-radius: var(--sds-radius-small); padding: 4px 10px;
  font-size: var(--sds-fs-400); font-weight: var(--sds-fw-semibold); margin-bottom: 24px;
}

/* logg inn-kort */
.lk-login .lk-login__h2 { margin-bottom: 12px; max-width: 707px; }
.lk-login .lk-login__lede { max-width: 707px; margin-bottom: 24px; color: var(--sds-purple-10); }
.lk-navcards { display: flex; gap: 12px; flex-wrap: wrap; }

/* info box */
.lk-info {
  background: #E6F0FF; border-radius: var(--sds-radius-small);
  padding: 12px 16px; max-width: 560px; margin: 0 auto 28px;
  font-size: var(--sds-fs-400); line-height: var(--sds-lh-l);
  color: var(--sds-purple-10); text-align: left;
}

/* profilknapp (innlogget) */
.lk-profile {
  display: inline-flex; align-items: center; gap: 12px; cursor: pointer;
  background: transparent; border: none; border-radius: 24px;
  padding: 2px 16px 2px 2px; font-family: var(--sds-font-family);
}
.lk-profile:hover { background: var(--sds-purple-90); }
.lk-profile:focus-visible { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }
.lk-avatar {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  background: #FF957A; color: var(--sds-purple-10);
  display: grid; place-items: center; font-size: var(--sds-fs-300); line-height: 1;
}
.lk-profile__label { font-size: var(--sds-fs-300); color: var(--sds-purple-10); }

/* ---------- Min side ---------- */
.lk-main.lk-minside { background: var(--sds-neutral-95); padding: 96px 0; }
.lk-minside__inner { display: flex; flex-direction: column; align-items: flex-start; gap: 48px; }
.lk-minside__top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.lk-minside__h1 { font-size: var(--sds-fs-1000); line-height: 48px; font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); margin: 0; }
.lk-logout {
  background: #fff; border: 1px solid var(--sds-purple-10); border-radius: var(--sds-radius-full);
  padding: 6px 16px; font-family: var(--sds-font-family); font-size: var(--sds-fs-300);
  color: var(--sds-purple-10); cursor: pointer;
}
.lk-logout:hover { background: var(--sds-neutral-97); }
.lk-logout:focus-visible { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }
.lk-details { width: 394px; max-width: 100%; display: flex; flex-direction: column; gap: 4px; margin: 0; }
.lk-details__row { display: grid; grid-template-columns: 139px 1fr; gap: 24px; }
.lk-details dt { font-size: var(--sds-fs-400); font-weight: var(--sds-fw-semibold); text-transform: uppercase; color: var(--sds-purple-10); line-height: 28px; }
.lk-details dd { margin: 0; font-size: var(--sds-fs-400); line-height: 28px; color: var(--sds-purple-10); }
.lk-navcard {
  width: 420px; max-width: 100%; min-height: 158px; background: #fff; border: none; cursor: pointer;
  border-radius: var(--sds-radius-small); padding: 18px 16px 18px 24px;
  display: flex; flex-direction: column; gap: 24px; text-align: left;
  font-family: var(--sds-font-family);
  box-shadow: 0 2px 4px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.12);
  transition: box-shadow .15s ease;
}
.lk-navcard:hover { box-shadow: 0 4px 8px rgba(0,0,0,.14), 0 8px 20px rgba(0,0,0,.14); }
.lk-navcard:focus-visible { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }
.lk-navcard__top { display: flex; align-items: center; justify-content: space-between; }
.lk-navcard__icon { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--sds-purple-90); color: var(--sds-purple-10); display: grid; place-items: center; }
.lk-navcard__caret { color: var(--sds-purple-10); display: grid; place-items: center; }
.lk-navcard__body { display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
.lk-navcard__title { font-size: var(--sds-fs-500); line-height: 24px; font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); }
.lk-navcard__text { font-size: var(--sds-fs-300); line-height: 24px; color: var(--sds-neutral-25); }

/* language dropdown */
.lk-lang { position: relative; }
.lk-lang__btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: transparent; border: none; cursor: pointer;
  font-family: var(--sds-font-family); font-size: var(--sds-fs-300); color: var(--sds-purple-10);
  padding: 8px 12px; border-radius: var(--sds-radius-full);
}
.lk-lang__btn:hover { background: var(--sds-purple-90); }
.lk-lang__btn .chev { transition: transform .15s ease; }
.lk-lang__btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
.lk-lang__menu {
  position: absolute; right: 0; top: calc(100% + 8px);
  background: #fff; border: 1px solid var(--sds-color-border-default);
  border-radius: var(--sds-radius-medium); box-shadow: var(--sds-shadow-elevated-default);
  min-width: 200px; padding: 6px; z-index: var(--sds-z-menu);
}
.lk-lang__item {
  display: block; width: 100%; text-align: left; background: transparent; border: none; cursor: pointer;
  font-family: var(--sds-font-family); font-size: var(--sds-fs-300); color: var(--sds-purple-10);
  padding: 10px 12px; border-radius: var(--sds-radius-small);
}
.lk-lang__item:hover { background: var(--sds-neutral-97); }
.lk-lang__item[aria-current="true"] { font-weight: var(--sds-fw-semibold); background: var(--sds-purple-98); }

/* ---------- Hero ---------- */
.lk-hero { background: var(--sds-purple-95); padding: 56px 0 64px; }
.lk-hero__title { font-size: var(--sds-fs-1500); line-height: 1.05; letter-spacing: -.02em; font-weight: var(--sds-fw-bold); margin: 0 0 16px; color: var(--sds-purple-10); }
.lk-hero__lede { font-size: var(--sds-fs-400); line-height: var(--sds-lh-l); color: var(--sds-purple-10); margin: 0 0 28px; max-width: 760px; }

/* search */
.lk-search { position: relative; display: flex; align-items: center; }
.lk-search__icon { position: absolute; left: 20px; color: var(--sds-neutral-46); pointer-events: none; }
.lk-search__input {
  width: 100%; font-family: var(--sds-font-family); font-size: var(--sds-fs-400);
  color: var(--sds-purple-10); background: #fff;
  border: 1px solid var(--sds-color-border-default);
  border-radius: var(--sds-radius-medium);
  padding: 18px 20px 18px 56px;
}
.lk-search__input::placeholder { color: var(--sds-neutral-46); }
.lk-search__input:focus { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; border-color: var(--sds-color-border-focus); }

/* category cards */
.lk-cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
.lk-cat {
  background: #fff; border-radius: var(--sds-radius-medium);
  border: 1px solid transparent;
  padding: 28px 24px 24px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  transition: box-shadow .2s ease, transform .2s ease;
  font-family: var(--sds-font-family);
}
.lk-cat:hover { box-shadow: var(--sds-shadow-elevated-default); transform: translateY(-3px); }
.lk-cat:focus-visible { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }
.lk-cat__art { width: 168px; height: 150px; display: grid; place-items: center; }
.lk-cat__img { width: 100%; height: 100%; object-fit: contain; display: block; }
.lk-cat__label { font-size: var(--sds-fs-400); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); }

/* ---------- Main / content cards ---------- */
.lk-main { flex: 1; padding: 48px 0 64px; }
.lk-stack { display: flex; flex-direction: column; gap: 28px; }
.lk-card {
  background: #fff; border-radius: var(--sds-radius-large);
  padding: 48px;
}
.lk-card--center { text-align: center; }
.lk-card__h3 { font-size: var(--sds-fs-800); font-weight: var(--sds-fw-bold); margin: 0 0 16px; color: var(--sds-purple-10); }
.lk-card__h2 { font-size: var(--sds-fs-1100); font-weight: var(--sds-fw-bold); margin: 0 0 20px; color: var(--sds-purple-10); line-height: 1.1; text-wrap: balance; }
.lk-card__lede { font-size: var(--sds-fs-300); line-height: var(--sds-lh-l); color: var(--sds-neutral-25); margin: 0 0 28px; }
.lk-card--center .lk-card__lede { max-width: 660px; margin-left: auto; margin-right: auto; }
.lk-btn-row { display: flex; gap: 16px; flex-wrap: wrap; }
.lk-card--center .lk-btn-row { justify-content: center; }

/* feature list */
.lk-features { display: flex; flex-direction: column; gap: 22px; width: fit-content; max-width: 100%; margin: 8px auto 36px; text-align: left; }
.lk-feature { display: flex; align-items: center; gap: 20px; text-align: left; }
.lk-feature__icon { flex: none; color: var(--sds-purple-10); display: grid; place-items: center; }
.lk-feature__text { font-size: var(--sds-fs-300); color: var(--sds-purple-10); line-height: var(--sds-lh-m); white-space: nowrap; }

/* nested accent box */
.lk-callout {
  background: var(--sds-purple-95); border-radius: var(--sds-radius-medium);
  padding: 28px 32px; text-align: left; max-width: 680px; margin: 0 auto;
}
.lk-callout__title { font-size: var(--sds-fs-500); font-weight: var(--sds-fw-bold); margin: 0 0 10px; color: var(--sds-purple-10); }
.lk-callout__body { font-size: var(--sds-fs-300); line-height: var(--sds-lh-l); color: var(--sds-neutral-25); margin: 0 0 20px; }

/* leverandør illustration */
.lk-illu { margin: 8px auto 0; max-width: 240px; }
.lk-illu svg, .lk-illu img { width: 100%; height: auto; display: block; }
.lk-inline-link { color: var(--sds-color-text-action); text-decoration: underline; font-weight: var(--sds-fw-semibold); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }

/* external-link glyph helper */
.lk-ext { display: inline-flex; vertical-align: middle; }

/* ---------- Footer ---------- */
.lk-footer { background: var(--sds-purple-10); color: var(--sds-purple-90); padding: 56px 0 40px; }
.lk-footer__inner { max-width: 1400px; margin: 0 auto; padding: 0 40px; }
.lk-footer__top { display: grid; grid-template-columns: 1.1fr 2.4fr; gap: 48px; }
.lk-footer__brandlink { display: inline-flex; align-items: center; gap: 14px; color: #fff; text-decoration: none; }
.lk-footer__brandlink svg { height: 40px; width: auto; }
.lk-footer__brandtext { font-size: var(--sds-fs-200); line-height: 1.3; color: #fff; }
.lk-footer__brandtext strong { font-size: var(--sds-fs-500); font-weight: var(--sds-fw-semibold); display: block; }
.lk-totop { margin-top: 32px; }
.lk-footer__cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.lk-footer__col h4 { font-size: var(--sds-fs-300); font-weight: var(--sds-fw-semibold); color: #fff; margin: 0 0 18px; }
.lk-footer__col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.lk-footer__col a { color: var(--sds-purple-90); text-decoration: underline; text-underline-offset: 3px; font-size: var(--sds-fs-200); display: inline-flex; align-items: center; gap: 6px; }
.lk-footer__col a:hover { color: #fff; }

/* ============================================================
   Search results view (interactive demo)
   ============================================================ */
.lk-results { flex: 1; padding: 40px 0 72px; }
.lk-results__bar { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.lk-results__bar .lk-search { flex: 1; }
.lk-back {
  background: transparent; border: none; cursor: pointer; color: var(--sds-color-text-action);
  font-family: var(--sds-font-family); font-weight: var(--sds-fw-semibold); font-size: var(--sds-fs-300);
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 4px;
}
.lk-back:hover { color: var(--sds-color-text-action-hover); }

.lk-results__layout { display: grid; grid-template-columns: 260px 1fr; gap: 32px; align-items: start; }
.lk-filters { background: #fff; border-radius: var(--sds-radius-medium); padding: 24px; position: sticky; top: 96px; }
.lk-filters h3 { font-size: var(--sds-fs-300); font-weight: var(--sds-fw-semibold); margin: 0 0 8px; }
.lk-filtergroup { padding: 16px 0; border-top: 1px solid var(--sds-neutral-92); }
.lk-filtergroup:first-of-type { border-top: none; }
.lk-filtergroup__h { font-size: var(--sds-fs-200); font-weight: var(--sds-fw-semibold); color: var(--sds-neutral-35); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 12px; }
.lk-check { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: var(--sds-fs-300); color: var(--sds-purple-10); }
.lk-check input { width: 18px; height: 18px; accent-color: var(--sds-purple-65); cursor: pointer; }
.lk-check .count { margin-left: auto; color: var(--sds-neutral-46); font-size: var(--sds-fs-200); }
.lk-clearfilters { background: none; border: none; color: var(--sds-color-text-action); font-family: var(--sds-font-family); font-size: var(--sds-fs-200); font-weight: var(--sds-fw-semibold); cursor: pointer; padding: 4px 0; }

.lk-results__head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.lk-results__count { font-size: var(--sds-fs-500); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); }
.lk-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.lk-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--sds-purple-95); color: var(--sds-purple-20); border: none; border-radius: var(--sds-radius-full); padding: 6px 8px 6px 14px; font-size: var(--sds-fs-200); font-weight: var(--sds-fw-semibold); font-family: var(--sds-font-family); cursor: pointer; }
.lk-chip:hover { background: var(--sds-purple-90); }
.lk-chip .x { display: inline-grid; place-items: center; }

.lk-resultgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.lk-lmcard { background: #fff; border: 1px solid var(--sds-color-border-default); border-radius: var(--sds-radius-medium); padding: 24px; display: flex; flex-direction: column; gap: 12px; transition: box-shadow .2s ease, transform .2s ease; cursor: pointer; }
.lk-lmcard:hover { box-shadow: var(--sds-shadow-elevated-default); transform: translateY(-2px); }
.lk-lmcard__top { display: flex; align-items: flex-start; gap: 14px; }

/* ============================================================
   Søkeside (search page)
   ============================================================ */
.sk-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--sds-neutral-100); }
.sk-layout { flex: 1; display: grid; grid-template-columns: 248px minmax(0, 1fr); max-width: 1360px; width: 100%; margin: 0 auto; align-items: start; }

/* ---- Filter panel ---- */
.sk-filters { border-right: 1px solid var(--sds-neutral-90); padding: 24px 20px; position: sticky; top: 67px; align-self: start; }
.sk-filters__head { display: flex; align-items: center; gap: 8px; font-size: var(--sds-fs-300); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); margin: 0 0 16px; }
.sk-apply { width: 100%; justify-content: center; margin-bottom: 8px; }
.sk-fgroup { border-top: 1px solid var(--sds-neutral-90); padding: 16px 0; }
.sk-fgroup__head { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: none; cursor: pointer; font-family: var(--sds-font-family); font-size: var(--sds-fs-300); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); padding: 4px 0; text-align: left; }
.sk-fgroup__head .chev { transition: transform .15s ease; color: var(--sds-purple-10); }
.sk-fgroup__head[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sk-fgroup__list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.sk-check { display: flex; align-items: center; gap: 10px; font-size: var(--sds-fs-300); color: var(--sds-purple-10); cursor: pointer; line-height: 1.3; }
.sk-check input { appearance: none; -webkit-appearance: none; flex: none; width: 18px; height: 18px; border: 1.5px solid var(--sds-neutral-87); border-radius: var(--sds-radius-minimal); background: #fff; cursor: pointer; display: grid; place-content: center; transition: background .12s, border-color .12s; }
.sk-check input:checked { background: var(--sds-purple-65); border-color: var(--sds-purple-65); }
.sk-check input:checked::after { content: ""; width: 10px; height: 6px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); }
.sk-check input:focus-visible { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }
.sk-vismore { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-family: var(--sds-font-family); font-size: var(--sds-fs-200); color: var(--sds-neutral-35); padding: 2px 0; }
.sk-vismore:hover { color: var(--sds-purple-65); }
.sk-vismore .chev { transition: transform .15s ease; }
.sk-vismore[aria-expanded="true"] .chev { transform: rotate(180deg); }

/* ---- Nested fag-tree (Videregåendefag) ---- */
.sk-fgroup__list--tree { gap: 0; margin-top: 4px; }
.sk-ftree { display: flex; flex-direction: column; }
.sk-ftree__children { display: flex; flex-direction: column; }
.sk-fnode { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: none; border: none; cursor: pointer; font-family: var(--sds-font-family); font-size: var(--sds-fs-300); font-weight: var(--sds-fw-regular); color: var(--sds-purple-10); text-align: left; padding: 10px 0; line-height: 1.3; }
.sk-fnode:hover { color: var(--sds-purple-65); }
.sk-fnode .chev { transition: transform .15s ease; color: currentColor; flex: none; }
.sk-fnode[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sk-fnode__label { flex: 1 1 auto; min-width: 0; }
.sk-ftree .sk-check { padding: 8px 0; }

/* ---- Content column ---- */
.sk-content { padding: 24px 40px 56px; min-width: 0; }
.sk-breadcrumb { font-size: var(--sds-fs-200); color: var(--sds-neutral-35); margin-bottom: 16px; }
.sk-breadcrumb a { color: var(--sds-neutral-35); text-decoration: none; }
.sk-breadcrumb a:hover { color: var(--sds-purple-65); text-decoration: underline; }
.sk-breadcrumb span { color: var(--sds-neutral-58); margin: 0 6px; }

.sk-searchbar { position: relative; display: flex; align-items: center; }
.sk-searchbar input { width: 100%; font-family: var(--sds-font-family); font-size: var(--sds-fs-300); color: var(--sds-purple-10); background: #fff; border: 1px solid var(--sds-neutral-90); border-radius: var(--sds-radius-small); padding: 13px 48px 13px 16px; }
.sk-searchbar input::placeholder { color: var(--sds-neutral-46); }
.sk-searchbar input:focus { outline: 2px solid var(--sds-color-border-focus); outline-offset: 1px; border-color: var(--sds-color-border-focus); }
.sk-searchbar__icon { position: absolute; right: 16px; color: var(--sds-neutral-35); pointer-events: none; display: inline-flex; }

.sk-filterbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.sk-levels { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.sk-pill { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--sds-neutral-87); border-radius: var(--sds-radius-full); padding: 7px 14px; font-family: var(--sds-font-family); font-size: var(--sds-fs-200); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); cursor: pointer; transition: background .12s, border-color .12s; white-space: nowrap; }
.sk-pill:hover { background: var(--sds-neutral-97); }
.sk-pill .ic { display: inline-flex; color: var(--sds-purple-65); }
.sk-pill--active { border-color: var(--sds-purple-65); background: var(--sds-purple-90); color: var(--sds-purple-20); }
.sk-pill--active .ic { color: var(--sds-purple-31); }
.sk-clearall { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; font-family: var(--sds-font-family); font-size: var(--sds-fs-200); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-65); white-space: nowrap; }
.sk-clearall:hover { color: var(--sds-purple-55); }

.sk-count { font-size: var(--sds-fs-600); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); margin: 24px 0 16px; }

/* ---- Result card ---- */
.sk-card { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 20px; align-items: start; background: #fff; border: 1px solid var(--sds-neutral-90); border-radius: var(--sds-radius-medium); padding: 16px; box-shadow: 0 4px 12px rgba(10,1,50,.08); margin-bottom: 16px; cursor: pointer; transition: box-shadow .2s ease, transform .2s ease; }
.sk-card:hover { box-shadow: var(--sds-shadow-elevated-default); transform: translateY(-2px); }
.sk-thumb { position: relative; width: 112px; height: 88px; border-radius: var(--sds-radius-small); display: grid; place-items: center; font-weight: var(--sds-fw-bold); font-size: 28px; overflow: hidden; }
.sk-thumb__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .2s ease; }
.sk-card__main { min-width: 0; }
.sk-badges { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.sk-typebadge { background: var(--sds-purple-95); color: var(--sds-purple-65); font-size: var(--sds-fs-100); font-weight: var(--sds-fw-semibold); padding: 4px 10px; border-radius: var(--sds-radius-full); white-space: nowrap; }
.sk-typebadge--tjeneste { background: #F9DCEA; color: var(--sds-purple-10); }
.sk-card--tjeneste { text-decoration: none; color: inherit; }
.sk-service-meta { font-size: var(--sds-fs-200); color: var(--sds-purple-65); font-weight: var(--sds-fw-semibold); margin: 10px 0 0; }
.tj-vurdert-link { color: var(--sds-color-text-action); text-decoration: underline; text-underline-offset: 2px; }
.sk-vurdert { display: inline-flex; align-items: center; gap: 6px; font-size: var(--sds-fs-100); color: var(--sds-neutral-46); }
.sk-vurdert::before { content: "•"; color: var(--sds-neutral-58); }
.sk-card__title { font-size: var(--sds-fs-400); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); margin: 0 0 3px; line-height: 1.25; }
.sk-card__vendor { font-size: var(--sds-fs-200); color: var(--sds-neutral-35); margin: 0 0 8px; }
.sk-card__desc { font-size: var(--sds-fs-200); color: var(--sds-neutral-35); line-height: var(--sds-lh-xl); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sk-meta { display: flex; gap: 28px; }
.sk-meta__col { min-width: 92px; }

.sk-metapills { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.sk-fagpill { font-size: var(--sds-fs-100); font-weight: var(--sds-fw-semibold); padding: 3px 10px; border-radius: var(--sds-radius-full); background: var(--sds-neutral-95); color: var(--sds-neutral-25); white-space: nowrap; }
.sk-trinnpill { font-size: var(--sds-fs-100); font-weight: var(--sds-fw-semibold); padding: 3px 10px; border-radius: var(--sds-radius-full); background: var(--sds-purple-95); color: var(--sds-purple-20); white-space: nowrap; }
.sk-morepill { font-size: var(--sds-fs-100); font-weight: var(--sds-fw-semibold); color: var(--sds-neutral-46); padding: 3px 4px; }

.sk-empty { background: var(--sds-neutral-97); border-radius: var(--sds-radius-medium); padding: 48px 32px; text-align: center; color: var(--sds-neutral-35); }
.sk-empty h3 { margin: 0 0 8px; }

/* ---- Pagination + info box ---- */
.sk-showing { text-align: center; font-size: var(--sds-fs-200); color: var(--sds-neutral-35); margin: 24px 0 12px; }
.sk-morebtn { display: flex; margin: 0 auto; }
.lk-btn--ghost { background: #fff; color: var(--sds-purple-10); border-color: var(--sds-neutral-87); }
.lk-btn--ghost:hover { background: var(--sds-neutral-97); color: var(--sds-purple-10); }

.sk-infobox { background: var(--sds-purple-95); border-radius: var(--sds-radius-medium); padding: 24px; margin-top: 40px; }
.sk-infobox__title { font-size: var(--sds-fs-300); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); margin: 0 0 8px; }
.sk-infobox__body { font-size: var(--sds-fs-200); color: var(--sds-neutral-35); line-height: var(--sds-lh-l); margin: 0 0 18px; max-width: 640px; }

/* ---- Søkeside responsive ---- */
@media (max-width: 900px) {
  .sk-layout { grid-template-columns: 1fr; }
  .sk-filters { position: static; border-right: none; border-bottom: 1px solid var(--sds-neutral-90); }
  .sk-card { grid-template-columns: 88px minmax(0,1fr); }

@media (max-width: 720px) {

  .sk-thumb { width: 100%; height: 120px; }
  .sk-meta { flex-wrap: wrap; gap: 20px; }
}

/* ============================================================
   Tjeneste-detaljside (service detail)
   ============================================================ */
.tj-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--sds-neutral-95); }
.tj-wrap { max-width: 1080px; margin: 0 auto; padding: 0 40px; width: 100%; }

.tj-hero { background: var(--sds-purple-95); padding: 24px 0 32px; }
.tj-head { display: flex; gap: 32px; align-items: flex-start; }
.tj-logo { flex: none; width: 120px; height: 120px; border-radius: var(--sds-radius-medium); overflow: hidden; display: grid; place-items: center; font-weight: var(--sds-fw-bold); font-size: 40px; }
.tj-logo img { width: 100%; height: 100%; object-fit: cover; }
.tj-badges { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.tj-title { font-size: var(--sds-fs-900); font-weight: var(--sds-fw-bold); color: var(--sds-purple-10); margin: 0 0 6px; line-height: 1.15; }
.tj-vendor { font-size: var(--sds-fs-300); color: var(--sds-neutral-35); margin: 0 0 18px; }

/* tabs */

.tj-tabs__inner { max-width: 1080px; margin: 0 auto; padding: 0 40px; display: flex; gap: 32px; }
.tj-tab { position: relative; background: none; border: none; cursor: pointer; font-family: var(--sds-font-family); font-size: var(--sds-fs-300); color: var(--sds-purple-10); padding: 16px 2px; font-weight: var(--sds-fw-regular); }
.tj-tab:hover { color: var(--sds-purple-55); }
.tj-tab--active { font-weight: var(--sds-fw-semibold); }
.tj-tab--active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--sds-purple-65); border-radius: 3px; }

.tj-main { flex: 1; padding: 32px 0 56px; }
.tj-h2 { font-size: var(--sds-fs-900); font-weight: var(--sds-fw-bold); color: var(--sds-purple-10); margin: 0 0 24px; }
.tj-panel { background: var(--sds-neutral-100); border-radius: var(--sds-radius-large); padding: 32px; }

/* læremidler grid */
.tj-count { font-size: var(--sds-fs-200); color: var(--sds-neutral-35); margin: 16px 0 20px; }
.tj-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.tj-mcard { display: flex; flex-direction: column; gap: 12px; background: var(--sds-neutral-100); border: 1px solid var(--sds-neutral-90); border-radius: var(--sds-radius-medium); padding: 12px; cursor: pointer; transition: box-shadow .2s ease, transform .2s ease; }
.tj-mcard:hover { box-shadow: var(--sds-shadow-elevated-default); transform: translateY(-2px); }
.tj-mthumb { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: var(--sds-radius-small); overflow: hidden; display: grid; place-items: center; font-weight: var(--sds-fw-bold); font-size: 32px; }
.tj-mthumb__img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .2s ease; }
.tj-mbody { padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 8px; }
.tj-mtitle { font-size: var(--sds-fs-400); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); margin: 0; line-height: 1.25; }
.tj-mdesc { font-size: var(--sds-fs-200); color: var(--sds-neutral-35); line-height: var(--sds-lh-l); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* produktinformasjon */
.tj-dl { display: grid; grid-template-columns: 200px 1fr; gap: 16px 28px; margin: 0; }
.tj-dl dt { font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); font-size: var(--sds-fs-300); }
.tj-dl dd { margin: 0; color: var(--sds-neutral-25); font-size: var(--sds-fs-300); }
.tj-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.tj-lead { font-size: var(--sds-fs-400); line-height: var(--sds-lh-l); color: var(--sds-neutral-25); margin: 0 0 28px; max-width: 720px; }

/* personvern og vurdering */
.tj-vurd { display: flex; flex-direction: column; gap: 16px; margin-top: 8px; }
.tj-vrow { display: grid; grid-template-columns: 220px auto 1fr; gap: 16px; align-items: start; padding: 16px 0; border-top: 1px solid var(--sds-neutral-92); }
.tj-vrow:first-child { border-top: none; }
.tj-vname { font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); }

.tj-status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--sds-fs-100); font-weight: var(--sds-fw-semibold); padding: 4px 12px; border-radius: var(--sds-radius-full); white-space: nowrap; }
.tj-status--ok { background: var(--sds-color-success-background); color: var(--sds-color-success-text); }
.tj-status--warn { background: var(--sds-color-warning-background); color: var(--sds-color-warning-text); }
.tj-status--na { background: var(--sds-neutral-95); color: var(--sds-neutral-35); }
.tj-notice { background: var(--sds-purple-95); border-radius: var(--sds-radius-medium); padding: 20px 24px; color: var(--sds-purple-10); font-size: var(--sds-fs-300); }

@media (max-width: 900px) {
  .tj-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 720px) {
  .tj-wrap, .tj-tabs__inner { padding: 0 20px; }
  .tj-head { flex-direction: column; gap: 20px; }
  .tj-tabs__inner { gap: 18px; overflow-x: auto; }
  .tj-tab { white-space: nowrap; }
  .tj-grid { grid-template-columns: 1fr; }
  .tj-dl { grid-template-columns: 1fr; gap: 4px 0; }
  .tj-dl dd { margin-bottom: 12px; }
  .tj-vrow { grid-template-columns: 1fr; gap: 8px; }

.tj-pi__list { list-style: none; margin: 0; padding: 0; }
.tj-pi__list li { padding: 13px 0; border-bottom: 1px solid var(--sds-neutral-92); font-size: var(--sds-fs-300); color: var(--sds-purple-10); }
.tj-updated { text-align: right; font-size: var(--sds-fs-200); color: var(--sds-neutral-46); margin: 16px 0 0; }
.tj-infobox-blue { display: flex; gap: 12px; align-items: flex-start; background: var(--sds-color-info-background); border-radius: var(--sds-radius-small); padding: 16px; margin: 18px 0 8px; font-size: var(--sds-fs-200); line-height: var(--sds-lh-l); color: var(--sds-blue-15); }
.tj-infobox-blue svg { flex: none; color: var(--sds-color-info-border); margin-top: 1px; }
.tj-infobox-blue a { color: var(--sds-blue-41); }

.tj-acc__row { border-bottom: 1px solid var(--sds-neutral-92); }
.tj-acc__row:last-child { border-bottom: none; }
.tj-acc__q { display: flex; align-items: center; gap: 14px; width: 100%; background: none; border: none; cursor: pointer; padding: 16px 0; font-family: var(--sds-font-family); font-size: var(--sds-fs-300); color: var(--sds-purple-10); text-align: left; }
.tj-acc__icon { flex: none; width: 28px; height: 28px; border-radius: var(--sds-radius-full); border: 1.5px solid var(--sds-purple-65); color: var(--sds-purple-65); display: grid; place-items: center; transition: transform .15s ease; }
.tj-acc__q[aria-expanded="true"] .tj-acc__icon { transform: rotate(180deg); }
.tj-acc__a { padding: 0 0 18px 42px; font-size: var(--sds-fs-300); line-height: var(--sds-lh-l); color: var(--sds-neutral-35); max-width: 820px; }

/* ---- Læremiddel detail ---- */
a.sk-card { text-decoration: none; color: inherit; }
.tj-mcard { text-decoration: none; color: inherit; }
.lm-typebadge { display: inline-block; white-space: nowrap; background: #F9DCEA; color: var(--sds-purple-10); font-size: var(--sds-fs-100); font-weight: var(--sds-fw-semibold); padding: 4px 10px; border-radius: var(--sds-radius-full); }
.lm-hero-thumb { flex: none; position: relative; width: 260px; height: 150px; border-radius: var(--sds-radius-medium); overflow: hidden; display: grid; place-items: center; font-weight: var(--sds-fw-bold); font-size: 40px; }
.lm-part { margin-top: 28px; }
.lm-part__h { font-size: var(--sds-fs-800); font-weight: var(--sds-fw-bold); color: var(--sds-purple-10); margin: 0 0 12px; }
.lm-svc { display: flex; gap: 24px; align-items: flex-start; background: var(--sds-purple-98); border-radius: var(--sds-radius-medium); padding: 24px; margin-top: 20px; }
.lm-svc__logo { flex: none; position: relative; width: 120px; height: 120px; border-radius: var(--sds-radius-medium); overflow: hidden; display: grid; place-items: center; font-weight: var(--sds-fw-bold); font-size: 36px; }
.lm-svc__body { min-width: 0; }
.lm-svc__title { font-size: var(--sds-fs-600); font-weight: var(--sds-fw-bold); color: var(--sds-purple-10); margin: 10px 0 12px; }
.lm-svc__links { padding-left: 20px; }
@media (max-width: 720px) {
  .lm-hero-thumb { width: 100%; height: 180px; }
  .lm-svc { flex-direction: column; gap: 16px; }
}


/* ============ Tilgjengelige tjenester (tl-) ============ */
.tl-main { flex: 1; background: var(--sds-neutral-95); padding: 96px 0; }
.tl-inner { display: flex; flex-direction: column; gap: 48px; align-items: flex-start; }
.tl-crumbs { display: flex; align-items: center; gap: 4px; font-size: var(--sds-fs-400); color: var(--sds-purple-10); }
.tl-crumbs__link { color: var(--sds-purple-10); text-decoration: underline; }
.tl-crumbs__now { color: #595959; }
.tl-head { width: 100%; display: flex; flex-direction: column; gap: 12px; }
.tl-head__top { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.tl-h1 { font-size: var(--sds-fs-800); line-height: 1.25; font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); margin: 0; }
.tl-faqjump { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: none; cursor: pointer; border-radius: var(--sds-radius-full); padding: 12px; font-family: var(--sds-font-family); font-size: var(--sds-fs-400); color: var(--sds-purple-10); }
.tl-faqjump:hover { background: var(--sds-purple-90); }
.tl-lede { max-width: 771px; display: flex; flex-direction: column; gap: 12px; }
.tl-lede p { margin: 0; font-size: var(--sds-fs-500); line-height: 32px; color: #595959; }
.tl-section { width: 100%; }
.tl-h2 { font-size: var(--sds-fs-700); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); margin: 0 0 24px; }

/* søk */
.tl-search { position: relative; width: 488px; max-width: 100%; display: flex; align-items: center; background: #fff; border: 2px solid #959595; border-radius: var(--sds-radius-small); padding: 8px; gap: 8px; }
.tl-search:focus-within { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }
.tl-search__input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: var(--sds-font-family); font-size: var(--sds-fs-400); color: var(--sds-purple-10); }
.tl-search__input::placeholder { color: #595959; }
.tl-iconbtn { flex: none; display: grid; place-items: center; background: transparent; border: none; cursor: pointer; border-radius: var(--sds-radius-full); padding: 12px; color: var(--sds-purple-10); }
.tl-iconbtn:hover { background: var(--sds-purple-90); }
.tl-iconbtn:focus-visible { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }
.tl-iconbtn.is-active { background: #CCCCCC; }
.tl-search__btn { padding: 8px; }

/* treffbar */
.tl-bar { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 24px; margin: 24px 0; }
.tl-bar__left { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tl-count { font-size: var(--sds-fs-500); color: var(--sds-purple-10); }
.tl-updated { font-size: var(--sds-fs-300); color: #595959; }
.tl-bar__right { display: flex; align-items: center; gap: 12px; }

/* kort */
.tl-grid { display: grid; grid-template-columns: repeat(3, 288px); gap: 24px; }
.tl-list { display: flex; flex-direction: column; gap: 12px; }
.tl-card { background: #fff; border: none; border-radius: var(--sds-radius-small); overflow: hidden; padding: 0; cursor: pointer; text-align: left; font-family: var(--sds-font-family); display: flex; flex-direction: column; transition: box-shadow .15s ease; }
.tl-card:hover { box-shadow: var(--sds-shadow-elevated-default); }
.tl-card:focus-visible { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }
.tl-card__img { display: grid; place-items: center; width: 100%; height: 242px; font-size: var(--sds-fs-900); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); }
.tl-tint--rosa { background: #FBDCE4; }
.tl-tint--lilla { background: #E3DDFE; }
.tl-tint--gronn { background: #D6F0E2; }
.tl-card__body { display: flex; flex-direction: column; gap: 12px; padding: 32px 18px; }
.tl-card__name { font-size: var(--sds-fs-700); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tl-card__lev { font-size: var(--sds-fs-300); color: var(--sds-purple-10); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-card__desc { font-size: var(--sds-fs-300); line-height: 24px; color: var(--sds-neutral-25); max-height: 77px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tl-card--row { flex-direction: row; align-items: stretch; width: 100%; }
.tl-card--row .tl-card__img { width: 120px; height: auto; min-height: 120px; flex: none; font-size: var(--sds-fs-700); }
.tl-card--row .tl-card__body { padding: 18px 24px; gap: 4px; }
.tl-card--row .tl-card__desc { -webkit-line-clamp: 2; max-height: 48px; }

/* tom tilstand */
.tl-empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.tl-empty p { margin: 0; font-size: var(--sds-fs-500); color: var(--sds-purple-10); }
.tl-link { color: var(--sds-color-text-action); text-decoration: underline; }
.tl-link--btn { background: none; border: none; padding: 0; cursor: pointer; font-family: var(--sds-font-family); font-size: var(--sds-fs-400); }

/* paginering */
.tl-pager { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 24px; }
.tl-pager__step { display: inline-flex; align-items: center; gap: 4px; background: transparent; border: none; cursor: pointer; font-family: var(--sds-font-family); font-size: var(--sds-fs-400); color: var(--sds-purple-10); border-radius: var(--sds-radius-full); padding: 8px 12px; }
.tl-pager__step:hover { background: var(--sds-purple-90); }
.tl-pager__num { width: 48px; height: 48px; border-radius: 50%; background: transparent; border: none; cursor: pointer; font-family: var(--sds-font-family); font-size: var(--sds-fs-300); color: var(--sds-purple-10); }
.tl-pager__num:hover { background: var(--sds-purple-90); }
.tl-pager__num.is-active { background: #D1CDFF; font-weight: var(--sds-fw-semibold); }
.tl-pager__gap { padding: 0 4px; color: var(--sds-purple-10); }
.tl-pager__step:focus-visible, .tl-pager__num:focus-visible, .tl-crumbs__link:focus-visible, .tl-faqjump:focus-visible, .tl-link--btn:focus-visible { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }

/* trekkspill */
.tl-faqcard { background: #fff; border-radius: 10px; padding: 48px; display: flex; flex-direction: column; gap: 24px; }
.tl-acc__head { width: 100%; display: flex; align-items: center; gap: 12px; background: transparent; border: none; cursor: pointer; padding: 12px; text-align: left; font-family: var(--sds-font-family); }
.tl-acc__head:hover { background: var(--sds-neutral-97); }
.tl-acc__head:focus-visible { outline: 2px solid var(--sds-color-border-focus); outline-offset: 2px; }
.tl-acc__chev { flex: none; display: grid; place-items: center; color: var(--sds-purple-10); transition: transform .15s ease; transform: rotate(-90deg); }
.tl-acc__chev.is-open { transform: rotate(0deg); }
.tl-acc__q { font-size: var(--sds-fs-800); font-weight: var(--sds-fw-semibold); color: var(--sds-purple-10); line-height: 1.25; }
.tl-acc__body { padding: 8px 12px 24px; font-size: var(--sds-fs-300); line-height: 1.5; color: var(--sds-neutral-25); display: flex; flex-direction: column; gap: 12px; }
.tl-acc__body p { margin: 0; }
.tl-faq__list { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }

/* filter er valgt, men ikkje brukt enno */
.sk-pending { flex-basis: 100%; display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: var(--sds-fs-300); color: var(--sds-neutral-25); }
.sk-apply[disabled] { opacity: .5; cursor: default; }

/* valgte filter i eigen rad under skoleslag-pillene */
.sk-filterbar { flex-direction: column; align-items: stretch; }
.sk-chiprow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--sds-color-border-default); border-radius: var(--sds-radius-medium); background: #fff; }
.sk-chiprow .sk-pending { flex-basis: auto; margin-top: 0; margin-left: auto; }
